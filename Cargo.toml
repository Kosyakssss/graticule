[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/Kosyakssss/graticule"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
messages = { path = "crates/messages" }
ledger = { path = "crates/ledger" }
graticule-macros = { path = "crates/macros" }
kernel = { path = "crates/kernel" }
audio = { path = "crates/audio" }
galley = { path = "crates/galley" }
plotter = { path = "crates/plotter" }
specimen = { path = "crates/specimen" }
assay = { path = "crates/assay" }
engraver = { path = "crates/engraver" }
graticule = { path = "crates/graticule" }
proptest = "1.12.0"
flate2 = "1.1.10"

[profile.release]
debug = "line-tables-only"
