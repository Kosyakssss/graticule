[package]
name = "kernel"
description = "DK-01, Graticule's kernel: the tree, layout, painting, input and the shell around the operating system."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ledger.workspace = true
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
parley = "0.11.1"
pollster = "1.0.1"
rfd = "0.17.2"
png = "0.18.1"
profiling = "1"
swash = "0.2.10"
wgpu = "30.0.1"
winit = "0.30.13"
arboard = { version = "3.6.1", default-features = false }
accesskit = "0.25.1"
accesskit_winit = "0.34.1"
notify = "8.2.0"
jiff = "0.2.38"
arc-swap = "1.7.1"

[features]
profile = ["profiling/profile-with-tracy"]

[dev-dependencies]
proptest.workspace = true
graticule-macros.workspace = true
allocation-counter = "0.8.1"

[build-dependencies]
engraver.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
